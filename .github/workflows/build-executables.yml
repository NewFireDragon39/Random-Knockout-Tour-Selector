name: Build executables

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: Random-Knockout-Tour-Selector-Windows
            output-path: dist/Random-Knockout-Tour-Selector.exe

          - os: ubuntu-latest
            artifact-name: Random-Knockout-Tour-Selector-Linux
            output-path: dist/Random-Knockout-Tour-Selector_Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: python -m PyInstaller --onefile --name Random-Knockout-Tour-Selector exe-source.py

      - name: Rename Linux executable
        if: runner.os == 'Linux'
        run: mv dist/Random-Knockout-Tour-Selector dist/Random-Knockout-Tour-Selector_Linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.output-path }}
          if-no-files-found: error
